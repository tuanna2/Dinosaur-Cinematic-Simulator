<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinosaur Cinematic Simulator</title>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <aside id="hud">
        <strong>Dinosaur Cinematic Simulator</strong>
        <span id="status">Loading execution plan…</span>
        <div class="controls">
          <button id="play" type="button">Play</button>
          <button id="pause" type="button">Pause</button>
          <button id="frame" type="button">+1 Frame</button>
          <button id="restart" type="button">Restart</button>
        </div>
        <label class="timeline">
          <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
          <span id="time">00:00.0</span>
        </label>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
